# Example only — do NOT commit real values.
# Create the real secret out-of-band (see MIGRATION.md), e.g.:
#   kubectl -n reelmark create secret generic reelmark-secrets --from-env-file=.env.production
apiVersion: v1
kind: Secret
metadata:
  name: reelmark-secrets
  namespace: reelmark
type: Opaque
stringData:
  # Build-time + runtime (public, baked into the client bundle)
  NEXT_PUBLIC_SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "REPLACE"
  NEXT_PUBLIC_BASE_URL: "https://reelmark.app"
  NEXT_PUBLIC_SENTRY_DSN: "https://REPLACE@sentry.silexio.be/1"
  # Runtime only (server-side secrets — never NEXT_PUBLIC)
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE"
  SENTRY_DSN: "https://REPLACE@sentry.silexio.be/1"
  TMDB_READ_ACCESS_TOKEN: "REPLACE"
  WATCHMODE_API_KEY: "REPLACE"
