apiVersion: v1
kind: Namespace
metadata:
    name: reelmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: reelmark
    namespace: reelmark
    labels:
        app: reelmark
spec:
    revisionHistoryLimit: 3
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: reelmark
    template:
        metadata:
            labels:
                app: reelmark
        spec:
            terminationGracePeriodSeconds: 30
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app: reelmark
            imagePullSecrets:
                - name: ghcr-pull
            containers:
                - name: reelmark
                  image: ghcr.io/thesawkit/reelmark:__IMAGE_TAG__
                  ports:
                      - containerPort: 3000
                  # Node dimensionne son heap sur la mémoire de la machine, pas sur la limite
                  # du conteneur : sans cette borne un pic de rendu SSR se fait OOMKill à 1Gi.
                  env:
                      - name: NODE_OPTIONS
                        value: '--max-old-space-size=768'
                  envFrom:
                      - secretRef:
                            name: reelmark-secrets
                  lifecycle:
                      preStop:
                          exec:
                              command: ['sh', '-c', 'sleep 10']
                  resources:
                      requests:
                          cpu: '500m'
                          memory: '1Gi'
                          ephemeral-storage: '1Gi'
                      limits:
                          cpu: '1500m'
                          memory: '1Gi'
                          ephemeral-storage: '2Gi'
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 3
                      failureThreshold: 20
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
    name: reelmark
    namespace: reelmark
spec:
    type: ClusterIP
    selector:
        app: reelmark
    ports:
        - port: 80
          targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: reelmark
    namespace: reelmark
spec:
    maxUnavailable: 1
    selector:
        matchLabels:
            app: reelmark
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: reelmark
    namespace: reelmark
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: reelmark
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
