apiVersion: v1
kind: Namespace
metadata:
    name: reelmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: reelmark
    namespace: reelmark
    labels:
        app: reelmark
spec:
    revisionHistoryLimit: 3
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: reelmark
    template:
        metadata:
            labels:
                app: reelmark
        spec:
            # Next termine les requêtes en vol ET les callbacks after() avant de sortir sur
            # SIGTERM ; il lui faut un drain de 10 à 30 s. Ici : 10 s de preStop pour laisser
            # l'endpoint quitter le Service, puis 35 s de drain. Toutes les Server Actions du
            # projet déferrent leur revalidation dans after() — un drain trop court les perd.
            terminationGracePeriodSeconds: 45
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                fsGroup: 1001
                seccompProfile:
                    type: RuntimeDefault
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app: reelmark
            imagePullSecrets:
                - name: ghcr-pull
            containers:
                - name: reelmark
                  image: ghcr.io/thesawkit/reelmark:__IMAGE_TAG__
                  ports:
                      - containerPort: 3000
                  # Node dimensionne son heap sur la mémoire de la machine, pas sur la limite
                  # du conteneur : sans cette borne un pic de rendu SSR se fait OOMKill à 1Gi.
                  env:
                      - name: NODE_OPTIONS
                        value: '--max-old-space-size=768'
                  envFrom:
                      - secretRef:
                            name: reelmark-secrets
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ['ALL']
                  # Les deux seuls chemins que le serveur standalone écrit à l'exécution. Le
                  # `fsGroup` du pod les rend accessibles à l'uid 1001 — sans lui un emptyDir
                  # reste root:root en 0755 et le conteneur non-root ne peut pas y écrire.
                  volumeMounts:
                      - name: next-cache
                        mountPath: /app/.next/cache
                      - name: tmp
                        mountPath: /tmp
                  lifecycle:
                      preStop:
                          exec:
                              command: ['sh', '-c', 'sleep 10']
                  resources:
                      requests:
                          cpu: '500m'
                          memory: '1Gi'
                          ephemeral-storage: '1Gi'
                      limits:
                          cpu: '1500m'
                          memory: '1Gi'
                          ephemeral-storage: '2Gi'
                  # `timeoutSeconds` vaut 1 s par défaut : sous un pic de rendu SSR l'event loop
                  # dépasse ce seuil, trois fois de suite le pod redémarre, la charge se reporte
                  # sur les survivants et l'incident se propage. Les seuils ci-dessous laissent
                  # 60 s d'indisponibilité franche avant de conclure à un blocage réel.
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 3
                      timeoutSeconds: 3
                      failureThreshold: 20
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 3000
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3
            volumes:
                - name: next-cache
                  emptyDir:
                      sizeLimit: 1Gi
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
    name: reelmark
    namespace: reelmark
spec:
    type: ClusterIP
    selector:
        app: reelmark
    ports:
        - port: 80
          targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: reelmark
    namespace: reelmark
spec:
    maxUnavailable: 1
    # Un pod déjà cassé ne doit pas immobiliser le budget et bloquer le drain d'un nœud :
    # l'évincer restaure la disponibilité, il ne la dégrade pas.
    unhealthyPodEvictionPolicy: AlwaysAllow
    selector:
        matchLabels:
            app: reelmark
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: reelmark
    namespace: reelmark
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: reelmark
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
              name: cpu
              target:
                  type: Utilization
                  averageUtilization: 70
    # Sans `behavior`, le HPA double le nombre de pods toutes les 15 s. Chaque paire de pods
    # demande un nœud au cluster autoscaler, qui met 1 à 3 min à le provisionner : la montée
    # brutale réclame des machines que le pic n'aura plus besoin quand elles arriveront.
    behavior:
        scaleUp:
            stabilizationWindowSeconds: 60
            policies:
                - type: Pods
                  value: 2
                  periodSeconds: 60
        scaleDown:
            stabilizationWindowSeconds: 300
            policies:
                - type: Percent
                  value: 50
                  periodSeconds: 60
---
# Notifications « nouvel épisode » : un appel quotidien à la route protégée, qui détecte les
# épisodes sortis dans la fenêtre de rattrapage et prévient les abonnés. Label distinct de
# `app: reelmark`, sinon le Service router du trafic vers ce pod éphémère.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: reelmark-new-episodes
    namespace: reelmark
spec:
    schedule: '0 8 * * *'
    timeZone: 'Europe/Brussels'
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    jobTemplate:
        spec:
            backoffLimit: 2
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels:
                        app: reelmark-cron
                spec:
                    restartPolicy: Never
                    automountServiceAccountToken: false
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 100
                        runAsGroup: 101
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: trigger
                          image: curlimages/curl:8.22.0
                          env:
                              - name: CRON_SECRET
                                valueFrom:
                                    secretKeyRef:
                                        name: reelmark-secrets
                                        key: CRON_SECRET
                          command:
                              - sh
                              - -c
                              - >-
                                  curl --fail-with-body --silent --show-error --max-time 540
                                  -X POST -H "Authorization: Bearer $CRON_SECRET"
                                  http://reelmark.reelmark.svc.cluster.local/api/cron/new-episodes
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop: ['ALL']
                          resources:
                              requests:
                                  cpu: '10m'
                                  memory: '16Mi'
                              limits:
                                  cpu: '100m'
                                  memory: '32Mi'
---
# Suggestion hebdomadaire : un titre personnalisé par utilisateur, le vendredi en fin de journée.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: reelmark-suggestions
    namespace: reelmark
spec:
    schedule: '0 18 * * 5'
    timeZone: 'Europe/Brussels'
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    jobTemplate:
        spec:
            backoffLimit: 2
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels:
                        app: reelmark-cron
                spec:
                    restartPolicy: Never
                    automountServiceAccountToken: false
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 100
                        runAsGroup: 101
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: trigger
                          image: curlimages/curl:8.22.0
                          env:
                              - name: CRON_SECRET
                                valueFrom:
                                    secretKeyRef:
                                        name: reelmark-secrets
                                        key: CRON_SECRET
                          command:
                              - sh
                              - -c
                              - >-
                                  curl --fail-with-body --silent --show-error --max-time 540
                                  -X POST -H "Authorization: Bearer $CRON_SECRET"
                                  http://reelmark.reelmark.svc.cluster.local/api/cron/suggestions
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop: ['ALL']
                          resources:
                              requests:
                                  cpu: '10m'
                                  memory: '16Mi'
                              limits:
                                  cpu: '100m'
                                  memory: '32Mi'
