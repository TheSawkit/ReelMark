apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: reelmark
    namespace: reelmark
    annotations:
        # nginx bufferise les réponses upstream par défaut : il attend la réponse complète avant
        # de l'envoyer, ce qui annule le streaming des sections <Suspense> des fiches détail —
        # la page arrive d'un bloc au lieu de peindre la bannière en premier.
        nginx.ingress.kubernetes.io/proxy-buffering: 'off'
        nginx.ingress.kubernetes.io/proxy-body-size: '10m'
        nginx.ingress.kubernetes.io/proxy-buffer-size: '16k'
        nginx.ingress.kubernetes.io/proxy-buffers-number: '8'
        nginx.ingress.kubernetes.io/proxy-busy-buffers-size: '32k'
        nginx.ingress.kubernetes.io/affinity: 'cookie'
        nginx.ingress.kubernetes.io/affinity-mode: 'balanced'
        nginx.ingress.kubernetes.io/session-cookie-name: 'reelmark-affinity'
        nginx.ingress.kubernetes.io/session-cookie-max-age: '172800'
        nginx.ingress.kubernetes.io/session-cookie-samesite: 'Lax'
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - reelmark.silexio.be
          secretName: reelmark-tls
    rules:
        - host: reelmark.silexio.be
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: reelmark
                            port:
                                number: 80
