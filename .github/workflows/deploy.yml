name: Build & Deploy to Infomaniak K8s

# Déploie le commit que la CI vient de valider sur main, jamais un commit dont les tests sont rouges.
# workflow_run plutôt qu'un job dans ci.yml : la CI annule ses runs dépassés (cancel-in-progress),
# un déploiement en plein rollout ne doit pas l'être.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

env:
    IMAGE: ghcr.io/thesawkit/reelmark
    COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: deploy-app
    cancel-in-progress: false

jobs:
    build-deploy:
        if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ env.COMMIT }}

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ env.COMMIT }}
                      ${{ env.IMAGE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
                      NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                      NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
                      NEXT_DEPLOYMENT_ID=${{ env.COMMIT }}
                  secrets: |
                      tmdb_token=${{ secrets.TMDB_READ_ACCESS_TOKEN }}
                      actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

            - uses: azure/setup-kubectl@v4

            - name: Configure kubeconfig
              env:
                  KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
              run: |
                  mkdir -p ~/.kube
                  echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
                  chmod 600 ~/.kube/config

            - name: Deploy manifests
              run: |
                  sed "s|__IMAGE_TAG__|${{ env.COMMIT }}|g" k8s/app.yaml \
                    | kubectl apply --server-side --force-conflicts -f -
                  kubectl -n reelmark rollout status deployment/reelmark --timeout=300s
