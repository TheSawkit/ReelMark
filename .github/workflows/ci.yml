name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# La CI ne parle plus à aucun projet Supabase hébergé : le job E2E démarre une base locale
# (`supabase start`) construite depuis supabase/migrations/, y crée le compte de test
# (`pnpm seed:test`) et joue la suite dessus. Avant, elle tapait la base de production — ~22 %
# de ses requêtes le jour où le quota Free a sauté (septembre 2026). Le build inline cette URL
# dans le bundle client que le job E2E sert. Les deux clés sont celles, publiques, de
# démonstration de la CLI Supabase : elles n'ouvrent que la base éphémère du runner.
env:
    NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
    WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
    TEST_USER_EMAIL: e2e@reelmark.test
    TEST_USER_PASSWORD: ci-e2e-local-password
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    setup:
        name: Install dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/save@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

    typecheck:
        name: Type check
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm exec tsc --noEmit

    lint:
        name: Lint
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm run lint

    prettier:
        name: Vérifier le formatage du code
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: npm run format:check

    unit-tests:
        name: Unit tests
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm run test

    build:
        name: Build
        needs: [typecheck, lint, unit-tests]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - uses: actions/cache/restore@v5
              with:
                  path: .next/cache
                  key: nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      nextjs-${{ github.ref_name }}-
                      nextjs-main-
            - run: pnpm run build
            - uses: actions/cache/save@v5
              with:
                  path: .next/cache
                  key: nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
            # Serwist écrit le service worker dans public/, pas dans .next, et public/sw.js
            # est gitignoré : sans lui le job e2e sert /sw.js en 500 et la PWA n'est pas testée.
            - uses: actions/cache/save@v5
              with:
                  path: |
                      .next
                      public/sw.js
                      public/sw.js.map
                  key: next-build-${{ github.sha }}

    e2e:
        name: E2E tests
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - uses: actions/cache/restore@v5
              with:
                  path: |
                      .next
                      public/sw.js
                      public/sw.js.map
                  key: next-build-${{ github.sha }}
                  fail-on-cache-miss: true
            - id: playwright-cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
            - run: pnpm exec playwright install --with-deps chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            - uses: actions/cache/save@v5
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
            # Base vierge construite depuis supabase/migrations/ : ce que la baseline et les
            # migrations suivantes créent, rien d'autre. Studio, logs, mail et edge runtime ne
            # servent pas aux tests.
            - name: Start Supabase from supabase/migrations
              run: npx -y supabase@2.118.0 start -x studio,imgproxy,logflare,vector,edge-runtime,mailpit,postgres-meta,supavisor
            - run: pnpm seed:test
            - run: pnpm run test:e2e
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
