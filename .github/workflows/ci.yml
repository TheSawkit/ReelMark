name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Les tests E2E parlent à une vraie base Supabase. Les secrets E2E_* désignent un projet dédié
# aux tests ; tant qu'ils ne sont pas définis, la CI retombe sur le projet de production — dont
# elle représentait ~22 % des requêtes (quota Free dépassé en septembre 2026). Le build lit les
# mêmes valeurs : l'URL Supabase est inlinée dans le bundle client que le job e2e sert.
env:
    NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
    WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
    TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
    TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    setup:
        name: Install dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/save@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

    typecheck:
        name: Type check
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm exec tsc --noEmit

    lint:
        name: Lint
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm run lint

    prettier:
        name: Vérifier le formatage du code
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: npm run format:check

    unit-tests:
        name: Unit tests
        needs: setup
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - run: pnpm run test

    build:
        name: Build
        needs: [typecheck, lint, unit-tests]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - uses: actions/cache/restore@v5
              with:
                  path: .next/cache
                  key: nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      nextjs-${{ github.ref_name }}-
                      nextjs-main-
            - run: pnpm run build
            - uses: actions/cache/save@v5
              with:
                  path: .next/cache
                  key: nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
            # Serwist écrit le service worker dans public/, pas dans .next, et public/sw.js
            # est gitignoré : sans lui le job e2e sert /sw.js en 500 et la PWA n'est pas testée.
            - uses: actions/cache/save@v5
              with:
                  path: |
                      .next
                      public/sw.js
                      public/sw.js.map
                  key: next-build-${{ github.sha }}

    e2e:
        name: E2E tests
        needs: build
        # Un push sur dev avec une PR ouverte déclenchait la suite deux fois (push + pull_request),
        # et chaque run coûte 7 000 à 26 000 requêtes Supabase. Elle tourne sur les PR, sur main
        # et à la demande ; un push sur dev garde typecheck, lint, tests unitaires et build.
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/cache/restore@v5
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
                  fail-on-cache-miss: true
            - uses: actions/cache/restore@v5
              with:
                  path: |
                      .next
                      public/sw.js
                      public/sw.js.map
                  key: next-build-${{ github.sha }}
                  fail-on-cache-miss: true
            - id: playwright-cache
              uses: actions/cache/restore@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
            - run: pnpm exec playwright install --with-deps chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            - uses: actions/cache/save@v5
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
            - run: pnpm run test:e2e
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
